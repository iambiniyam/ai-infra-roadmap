name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "33 5 * * 1"   # Mondays, 05:33 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check internal links and anchors
        run: python3 scripts/check_internal_links.py

      - name: Check GitHub links
        run: python3 scripts/check_links.py --only-github
